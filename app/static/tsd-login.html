<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход — FulfillCore ТСД</title><link rel="stylesheet" href="/static/tsd.css?v=r96"></head><body><header class="topbar"><b>FulfillCore ТСД</b></header><main><div class="hero"><h1>Вход на склад</h1><p>Используйте свой логин и пароль FulfillCore.</p></div><form id="loginForm"><label>Логин<input id="user" name="username" autocomplete="username" required></label><label>Пароль<input id="pass" name="password" type="password" autocomplete="current-password" required></label><button class="primary big" id="enter">Войти</button><p class="msg error" id="error" role="alert"></p></form><a href="/tsd/install">Скачать приложение</a></main><script>document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('enter'),m=document.getElementById('error');b.disabled=true;m.textContent='';try{const r=await fetch('/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value.trim(),password:document.getElementById('pass').value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Не удалось войти');location.replace('/tsd')}catch(err){m.textContent=err.message}finally{b.disabled=false}};</script></body></html>
