<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FulfillCore — вход владельца ФФ</title>
<style>body{font-family:Arial,sans-serif;background:#f4f5f7;margin:0;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,90vw);background:#fff;padding:30px;border-radius:18px;box-shadow:0 20px 60px #0002}h1{margin:0 0 8px}.muted{color:#667085;margin:0 0 24px}label{display:grid;gap:6px;margin:14px 0;font-weight:700}input{font:inherit;padding:12px;border:1px solid #d0d5dd;border-radius:10px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#6c4cff;color:#fff;font-weight:800;font-size:16px}.err{color:#b42318;margin-top:12px}</style>
</head><body><form class="card" id="f"><h1>FulfillCore</h1><p class="muted">Вход владельца фулфилмента</p>
<label>Логин<input id="u" autocomplete="username" required></label>
<label>Пароль<input id="p" type="password" autocomplete="current-password" required></label>
<button>Войти</button><div id="e" class="err"></div></form>
<script>
f.onsubmit=async ev=>{ev.preventDefault();e.textContent='';try{const r=await fetch('/commercial/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Ошибка входа');location.href='/';}catch(x){e.textContent=x.message}};
</script></body></html>
