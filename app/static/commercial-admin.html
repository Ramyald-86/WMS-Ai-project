<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FulfillCore Commercial — Super Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f7f9;margin:0;color:#101828}.wrap{max-width:1200px;margin:30px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #d0d5dd}button{cursor:pointer;font-weight:700}.primary{background:#6c4cff;color:#fff;border-color:#6c4cff}.danger{background:#fff0f0;color:#b42318}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1.2fr;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #eaecf0}.small{color:#667085;font-size:13px}.ok{color:#067647}.bad{color:#b42318}.access{display:none;margin-top:12px;padding:12px;background:#f9fafb}.access.open{display:block}.access-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.choices{max-height:220px;overflow:auto;border:1px solid #e4e7ec;padding:8px;border-radius:9px}.choices label{display:block;padding:5px}
@media(max-width:850px){.grid,.row,.access-grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><h1>FulfillCore Commercial</h1><div class="small">Super Admin — кабинеты и подписки</div></div><a href="/">← FulfillCore</a></div>
<div class="card"><h2>Создать владельца ФФ</h2><div class="grid"><input id="name" placeholder="Название ФФ"><input id="login" placeholder="Логин"><input id="pass" placeholder="Пароль"><input id="days" type="number" value="30" min="1"></div><p><button class="primary" onclick="createTenant()">Создать кабинет</button></p><div id="msg"></div></div>
<div class="card"><div class="top"><h2>Фулфилменты</h2><button onclick="loadAll()">Обновить</button></div><div id="rows">Загрузка…</div></div></div>
<script>
let clients=[],warehouses=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={detail:t}}if(!r.ok)throw new Error(d.detail||'Ошибка');return d}
async function createTenant(){
  const msg = document.getElementById('msg');
  const tenantName = document.getElementById('name').value.trim();
  const username = document.getElementById('login').value.trim();
  const password = document.getElementById('pass').value;
  const subscriptionDays = parseInt(document.getElementById('days').value || '30', 10);

  msg.textContent = '';

  try {
    await api('/commercial/admin/tenants', {
      method: 'POST',
      body: JSON.stringify({
        name: tenantName,
        username: username,
        password: password,
        subscription_days: subscriptionDays
      })
    });

    msg.textContent = 'Кабинет создан';
    document.getElementById('pass').value = '';
    await loadAll();
  } catch(e) {
    let text = e && e.message ? e.message : String(e);
    if (text === '[object Object]') {
      text = 'Ошибка создания кабинета. Проверьте введённые данные.';
    }
    msg.textContent = text;
  }
}

async function loadAll(){try{[clients,warehouses]=await Promise.all([api('/masterdata/clients'),api('/masterdata/warehouses')]);const data=await api('/commercial/admin/tenants');rows.innerHTML=data.length?data.map(render).join(''):'Кабинетов пока нет'}catch(e){rows.innerHTML='<span class=bad>'+esc(e.message)+'</span>'}}
function render(x){const until=x.subscription_until?new Date(x.subscription_until).toLocaleString('ru-RU'):'без срока';return `<div class=row><div><b>${esc(x.name)}</b><div class=small>${esc(x.username||'')}</div></div><div class="${x.subscription_active?'ok':'bad'}">${x.subscription_active?'Активна':'Отключена/истекла'}<div class=small>до ${until}</div></div><div>${x.clients_count} клиентов<br>${x.warehouses_count} складов</div><div><button onclick="extend('${x.id}')">+30 дней</button> <button onclick="toggle('${x.id}',${String(x.status).toUpperCase()==='ACTIVE'})">${String(x.status).toUpperCase()==='ACTIVE'?'Отключить':'Включить'}</button></div><div><button onclick="password('${x.id}')">Пароль</button> <button onclick="openAccess('${x.id}')">Доступы</button></div></div><div class=access id="a-${x.id}"></div>`}
async function extend(id){await api(`/commercial/admin/tenants/${id}/extend`,{method:'POST',body:JSON.stringify({days:30})});loadAll()}
async function toggle(id,active){await api(`/commercial/admin/tenants/${id}/status`,{method:'PATCH',body:JSON.stringify({active:!active})});loadAll()}
async function password(id){const p=prompt('Новый пароль (минимум 6 символов)');if(!p)return;await api(`/commercial/admin/tenants/${id}/password`,{method:'POST',body:JSON.stringify({password:p})});alert('Пароль изменён')}
async function openAccess(id){const box=document.getElementById('a-'+id);if(box.classList.contains('open')){box.classList.remove('open');return}const a=await api(`/commercial/admin/tenants/${id}/access`);const c=new Set(a.client_ids),w=new Set(a.warehouse_ids);box.innerHTML=`<div class=access-grid><div><b>Клиенты</b><div class=choices>${clients.map(x=>`<label><input type=checkbox data-c value="${x.id}" ${c.has(String(x.id))?'checked':''}> ${esc(x.name)}</label>`).join('')}</div></div><div><b>Склады</b><div class=choices>${warehouses.map(x=>`<label><input type=checkbox data-w value="${x.id}" ${w.has(String(x.id))?'checked':''}> ${esc(x.name)}</label>`).join('')}</div></div></div><p><button class=primary onclick="saveAccess('${id}')">Сохранить доступы</button></p>`;box.classList.add('open')}
async function saveAccess(id){const box=document.getElementById('a-'+id);const client_ids=[...box.querySelectorAll('[data-c]:checked')].map(x=>x.value),warehouse_ids=[...box.querySelectorAll('[data-w]:checked')].map(x=>x.value);await api(`/commercial/admin/tenants/${id}/access`,{method:'PUT',body:JSON.stringify({client_ids,warehouse_ids})});alert('Доступы сохранены');loadAll()}
loadAll();
</script></body></html>
