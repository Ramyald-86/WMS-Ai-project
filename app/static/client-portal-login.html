<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FulfillCore · Клиент</title><link rel="stylesheet" href="/static/client-portal.css?v=r96"><link rel="stylesheet" href="/static/zipline-client-theme.css?v=zip1"></head><body class="portal-login"><main class="login-card"><div class="brand">FC</div><h1>Кабинет клиента</h1><p>Остатки и информация по браку вашего товара.</p><form id="loginForm"><label>Логин<input id="username" autocomplete="username" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Войти</button><p id="msg" class="msg"></p></form></main><script>
const form=document.getElementById('loginForm'),msg=document.getElementById('msg');form.onsubmit=async e=>{e.preventDefault();msg.textContent='Входим…';try{const r=await fetch('/client/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Ошибка входа');location.href='/client';}catch(x){msg.textContent=x.message;msg.className='msg error';}};
</script></body></html>
