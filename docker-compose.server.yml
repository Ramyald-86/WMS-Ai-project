services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulfillcore}
      POSTGRES_USER: ${POSTGRES_USER:-fulfillcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fulfillcore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fulfillcore} -d ${POSTGRES_DB:-fulfillcore}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: FulfillCore
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fulfillcore}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fulfillcore}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SECURE_COOKIE: "true"
      PRINT_AGENT_TOKEN: ${PRINT_AGENT_TOKEN}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-${DOMAIN}}
      PLATFORM_HOST_ALIASES: ${PLATFORM_HOST_ALIASES:-}
      TENANT_HOST_MODE: ${TENANT_HOST_MODE:-soft}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  fulfillcore_pg:
  caddy_data:
  caddy_config:
